name: Re-tag articles with AI

on:
  schedule:
    # Every hour at :17 — chips away at backlog
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: "Max articles to re-tag (default 1000)"
        required: false
        default: "1000"

permissions:
  contents: read

concurrency:
  group: retag
  cancel-in-progress: false

jobs:
  retag:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Run retag
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          RETAG_BATCH: ${{ github.event.inputs.batch }}
        run: bun run retag
